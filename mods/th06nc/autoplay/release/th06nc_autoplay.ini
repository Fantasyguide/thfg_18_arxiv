; 东方红魔乡 New Classic —— AI 代打 配置文件
; 放在游戏目录（和 th06nc.exe 同一层）。不放也能用，下面全是默认值。
; 分号后面是注释。改完保存，重启游戏生效。

[autoplay]

; ---------- 基本 ----------
start_mode    = 0     ; 启动时的模式：0 = MANUAL（自己玩）  1 = AUTO（鼠标引导）  2 = BYPASS（全自动）
toggle_vk     = 67    ; 切换模式的按键（虚拟键码）：67 = C。想用 F9 就填 120
show_text     = 1     ; 左上角显示模式文字：1 显示，0 不显示
text_scale_pct= 75    ; 文字大小（百分比）
text_x        = 4     ; 文字位置：相对关卡区左上角的横向偏移
text_y        = 20    ; 文字位置：纵向偏移

; ---------- 鼠标引导（AUTO 模式） ----------
guide_pct     = 70    ; 跟鼠标的力度（0–100）。越大越听话，但太大会顾不上躲弹
guide_dead    = 12    ; 离鼠标这么近就停下（像素）
guide_release = 24    ; 停下后鼠标要离开这么远才重新跟（防止鼠标压在自机上抖动）

; ---------- 躲弹（一般不用动） ----------
horizon       = 60    ; 往前看多少帧的弹道
tau           = 20    ; 越远的将来越不在意（帧）。调小 = 只管眼前
safe_r        = 48    ; 离弹道多远以内才开始躲（像素）
vortex_pct    = 80    ; 顺着弹流侧滑的倾向（0 = 只会后退，容易被顶住）
vo_frames     = 3     ; 几帧内必撞的方向直接禁止；全部禁止就放炸弹
slow_dist     = 40    ; 弹离自机这么近就按低速（像素）
slow_exit     = 60    ; 弹离开这么远才松开低速
slow_hold     = 10    ; 低速最少保持帧数
bomb_cooldown = 90    ; 两次炸弹之间至少隔多少帧

; ---------- 走位习惯（一般不用动） ----------
home_y        = 384   ; 没威胁时想待的高度（越大越靠下，关卡区高 448）
att_x_pct     = 12    ; 没威胁时往 boss 正下方对齐的力度
att_y_pct     = 12    ; 没威胁时回到 home_y 的力度
wall_margin   = 24    ; 离左 / 右 / 上边多近开始往回推（像素）
wall_margin_bottom = 12 ; 离下边多近开始往回推
wall_bottom_pct = 50  ; 下边往回推的力度

; ---------- 手感（一般不用动） ----------
smooth_pct    = 40    ; 动作平滑：数值越小越平滑但反应越慢
switch_hyst_pct = 25  ; 换方向要比现在的方向好这么多才换（百分比），防抽搐
hold_frames   = 4     ; 换了方向至少坚持几帧

; ---------- 日志 ----------
log_every     = 60    ; 每多少帧往 th06nc_autoplay.log 写一行状态；0 = 不写
